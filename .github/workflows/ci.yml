name: CI

on:
  push:
    branches: [main, fix/error-handling-schema]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bunx biome ci .

      - name: Test with coverage
        run: bun run test:coverage

      - name: Create worker test env file
        working-directory: apps/cloudflare-workers
        run: |
          echo 'AUTH_DB_URL="${{ secrets.AUTH_DB_URL }}"' > .dev.vars
          echo 'AUTH_DB_TOKEN="${{ secrets.AUTH_DB_TOKEN }}"' >> .dev.vars
          echo 'JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}"' >> .dev.vars
          echo 'JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"' >> .dev.vars

      - name: Integration tests
        run: bun run test:integration

      - name: Integration tests (plugins)
        run: bun run test:plugins

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
        with:
          fail_ci_if_error: false
          token: "#{{ secrets.CODECOV_TOKEN }}"

  plugin-removal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Strip observability plugin
        run: |
          rm -rf packages/observability
          sed -i '/obs-plugin 1\/2/,/observability/d' apps/cloudflare-workers/src/app.ts
          sed -i '/obs-plugin 2\/2/,/}));/d' apps/cloudflare-workers/src/app.ts
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('apps/cloudflare-workers/package.json', 'utf8'));
            delete pkg.dependencies['@private-landing/observability'];
            fs.writeFileSync('apps/cloudflare-workers/package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          bun install

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: tools/cli/go.mod
          cache-dependency-path: tools/cli/go.sum

      - name: Build CLI
        working-directory: tools/cli
        run: go build -o plctl ./cmd/plctl

      - name: Test CLI
        working-directory: tools/cli
        run: go test ./...
